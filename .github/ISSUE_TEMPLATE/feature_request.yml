name: ✨ Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! Please check the [Roadmap](https://github.com/Mahdi-hasan-shuvo/network-capture-pro-chrome-extension#-roadmap) and open issues first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.
  - type: checkboxes
    id: scope
    attributes:
      label: Fits the project's spirit
      description: Network Capture Pro is intentionally dependency-free, local-only, and build-step-free.
      options:
        - label: This can be done without adding runtime npm dependencies or a build step
        - label: This keeps everything local (no network calls / telemetry)
